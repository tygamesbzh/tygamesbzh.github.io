---
layout: null
---
{%- assign target = '/privacy-policy-and-terms-of-use/' | relative_url -%}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Privacy Policy and Terms of Use - {{ site.title }}</title>
  <link rel="canonical" href="{{ site.url }}{{ target }}">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url={{ target }}">
  <script>location.replace("{{ target }}" + location.hash);</script>
</head>
<body>
  <p><a href="{{ target }}">Privacy Policy and Terms of Use</a></p>
</body>
</html>
