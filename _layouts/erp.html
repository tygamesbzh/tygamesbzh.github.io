---
layout: page
---

<section class="section-hero">
  <div class="section-title-container">
    <h1 class="section-title">
      {{ page.hero_h1_pre }} <em class="not-italic text-accent">{{ page.hero_h1_em }}</em>
    </h1>
    <p class="section-subtitle">
      {{ page.hero_subtitle }}
    </p>
  </div>
</section>

<section class="section-padding bg-offwhite text-ink">
  <div class="section-container">
    <div class="grid md:grid-cols-2 gap-16 items-start text-ink/70">
      <ul class="space-y-4">
        {% for item in page.features %}
        <li class="checklist-item">
          <span class="checklist-check">✓</span>
          <span class="text-sm leading-relaxed">{{ item }}</span>
        </li>
        {% endfor %}
      </ul>

      <div class="grid grid-cols-2 gap-3">
        {% for n in (1..4) %}
        <a href="{{ '/assets/img/erp/erp' | append: n | append: '.png' | relative_url }}" target="_blank" rel="noopener" data-lightbox class="rounded-xl overflow-hidden bg-white/5 border border-white/10 hover:border-accent transition-colors">
          <img src="{{ '/assets/img/erp/erp' | append: n | append: '.png' | relative_url }}" alt="{{ page.screenshot_alt }} {{ n }}" class="w-full">
        </a>
        {% endfor %}
      </div>
    </div>

    <div class="text-center mt-12">
      <a href="mailto:{{ site.email }}?subject={{ page.cta_subject | uri_escape }}" class="btn-primary px-10 py-4 text-lg">{{ page.cta_label }}</a>
    </div>
  </div>
</section>

{% include lightbox.html label=page.title %}
